<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <div class="container">
        <div class="form">
            <h2>CADASTRO</h2>
            <form action="">
                <input type="text" id="nome" placeholder="Nome" class="form-control">
                <input type="email" id="email" placeholder="Email" class="form-control">
                <input type="tel" id="telefone" placeholder="Telefone" class="form-control">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="aceito-termos">
                    <label class="form-check-label" for="aceito-termos">Lei e concorde com os termos</label>
                </div>
                <button class="btn btn-success">Enviar</button>
            </form>
        </div>
    </div>
</body>

</html>
